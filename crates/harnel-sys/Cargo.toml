[package]
name = "harnel-sys"
description = "Native fx runtime bindings for Harnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "fx_core"
build = "build.rs"
include = ["Cargo.toml", "build.rs", "src/**", "native/**", "build/**", "native-release.json", "LICENSE", "README.md"]

[lints]
workspace = true

[features]
default = ["prebuilt"]
prebuilt = [
    "dep:harnel-native-x86_64-unknown-linux-gnu",
    "dep:harnel-native-aarch64-unknown-linux-gnu",
    "dep:harnel-native-x86_64-apple-darwin",
    "dep:harnel-native-aarch64-apple-darwin",
    "dep:harnel-native-x86_64-pc-windows-msvc",
]
build-from-source = ["dep:ureq", "dep:sha2", "dep:tar", "dep:lzma-rs", "dep:zip"]

[build-dependencies]
serde_json = "1.0"
ureq = { version = "3.1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
lzma-rs = { version = "0.3", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"], optional = true }

[target."x86_64-unknown-linux-gnu".dependencies]
harnel-native-x86_64-unknown-linux-gnu = { version = "=0.1.0", path = "../harnel-native-x86_64-unknown-linux-gnu", optional = true }

[target."aarch64-unknown-linux-gnu".dependencies]
harnel-native-aarch64-unknown-linux-gnu = { version = "=0.1.0", path = "../harnel-native-aarch64-unknown-linux-gnu", optional = true }

[target."x86_64-apple-darwin".dependencies]
harnel-native-x86_64-apple-darwin = { version = "=0.1.0", path = "../harnel-native-x86_64-apple-darwin", optional = true }

[target."aarch64-apple-darwin".dependencies]
harnel-native-aarch64-apple-darwin = { version = "=0.1.0", path = "../harnel-native-aarch64-apple-darwin", optional = true }

[target."x86_64-pc-windows-msvc".dependencies]
harnel-native-x86_64-pc-windows-msvc = { version = "=0.1.0", path = "../harnel-native-x86_64-pc-windows-msvc", optional = true }
