[package]
name = "infx"
description = "A small, embeddable agent harness with shared Rust SDK and ACP control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "harness", "acp", "llm", "sdk"]
categories = ["api-bindings", "development-tools"]

[dependencies]
infx-sys = { version = "0.1.1", path = "../infx-sys", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[lints]
workspace = true


[features]
default = ["prebuilt"]
prebuilt = ["infx-sys/prebuilt"]
build-from-source = ["infx-sys/build-from-source"]
