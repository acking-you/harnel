name: Published crate verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: crates.io notebook (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run an independent crates.io consumer
        run: python scripts/verify-registry.py
