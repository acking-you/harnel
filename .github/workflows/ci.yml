name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Released native SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - name: Preserve native source line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage the pinned native release
        run: python scripts/prepare-native.py
      - name: Verify the consumer does not have Zig
        run: python -c "import shutil; assert shutil.which('zig') is None, 'Consumer verification must run without Zig'"
      - name: Formatting
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check crates/harnel-native-*/build.rs crates/harnel-native-*/src/lib.rs
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native SDK and ACP integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Run CLI
        run: |
          cargo build --locked --bin harnel
          python scripts/smoke-cli.py target/debug/harnel${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Run documented examples
        run: |
          cargo build --examples --locked
          python scripts/smoke-examples.py --examples target/debug/examples
      - name: Check minimum Rust version
        if: matrix.os == 'ubuntu-24.04' || runner.os == 'Windows'
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --locked

  source:
    name: Automatic source build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve native source line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source build provisions its own compiler
        run: |
          python -c "import shutil; assert shutil.which('zig') is None"
          cargo clippy --workspace --all-targets --no-default-features --features build-from-source --locked -- -D warnings
          cargo test --workspace --all-targets --no-default-features --features build-from-source --locked
          cargo build --bin harnel --no-default-features --features build-from-source --locked
          python scripts/smoke-cli.py target/debug/harnel${{ runner.os == 'Windows' && '.exe' || '' }}
          cargo build --examples --no-default-features --features build-from-source --locked
          python scripts/smoke-examples.py --examples target/debug/examples

  packages:
    name: Packaged consumer without Zig
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare-native.py --all
      - run: python scripts/test-native-distribution.py
      - run: python scripts/bundle-native.py
      - run: python scripts/verify-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-crates
          path: target/verified-packages/*.crate
          if-no-files-found: error
